<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team 586</title>
<style>
  :root{--bg:#0a0e14;--card:#111823;--line:#26364a;--text:#eef3f9;--muted:#8da2ba;--accent:#ffc83d;--accent-hover:#ffd76b;--on-accent:#1a1300}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
       background:var(--bg);color:var(--text);font-family:"Barlow","Segoe UI","DejaVu Sans",Arial,sans-serif}
  main{width:100%;max-width:32rem;background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:2rem;text-align:center}
  h1{margin:0 0 .5rem;font-size:2rem}
  p{margin:0 0 1.75rem;color:var(--muted)}
  .btn{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:.5rem;padding:.8rem 1.4rem;
       font-weight:700;font-size:1.1rem;text-decoration:none}
  .btn:hover{background:var(--accent-hover)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Team 586</h1>
  <p>VEX tournament tools</p>
  <a class="btn" href="vex_display_web/index.html">Open the Event Display</a>
</main>
</body>
</html>
